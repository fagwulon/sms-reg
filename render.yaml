services:
  # Frontend — static site
  - type: web
    name: singles-and-married-summit-2026
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: ./sms-frontend/frontend
    headers:
      - path: /*.html
        name: Cache-Control
        value: no-cache, must-revalidate

  # Backend — FastAPI on Python
  - type: web
    name: sms-summit-backend
    runtime: python
    branch: main
    rootDir: ./backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_URL
        value: "https://singles-and-married-summit-2026.onrender.com"
      - key: INVITE_TTL_HOURS
        value: "48"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: QR_PREFIX
        value: "SMS26"
